worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  access_log off;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  open_file_cache max=1000 inactive=60s;

  # Files are gzipped at build time (see Dockerfile); nginx only picks the .gz twin.
  gzip off;
  gzip_static on;

  map $uri $cache_control {
    ~^/_next/static/ "public, max-age=31536000, immutable";
    default "public, max-age=0, must-revalidate";
  }

  server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # style-src keeps 'unsafe-inline' because motion renders its initial state as a style attribute.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' __API_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ ^(?<path>.+)/$ {
      return 308 $path;
    }

    location / {
      try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
  }
}
