name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality gates
    runs-on: ubuntu-latest
    # Decision Q9d: integration tests run against the same Postgres + pgvector image as production.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: thya
          POSTGRES_PASSWORD: thya
          POSTGRES_DB: thya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thya -d thya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
        env:
          RUN_INTEGRATION_TESTS: "1"
          TEST_DATABASE_URL: postgres://thya:thya@localhost:5432/thya_test
