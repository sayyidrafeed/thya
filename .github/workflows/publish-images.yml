name: Publish images

# Runs only after CI passes on a push to main, builds the exact commit CI verified, pushes it to
# GHCR, then asks Dokploy to redeploy. Pull requests never reach this workflow.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.app }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ matrix.app }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dokploy_app_id_var: DOKPLOY_API_APPLICATION_ID
          - app: web
            dokploy_app_id_var: DOKPLOY_WEB_APPLICATION_ID
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}-${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
            type=raw,value=main

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.API_PUBLIC_URL }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # Skipped until the Dokploy application exists and its id is stored as a repository variable.
      - name: Redeploy on Dokploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APPLICATION_ID: ${{ vars[matrix.dokploy_app_id_var] }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$APPLICATION_ID" ]; then
            echo "Dokploy deploy not configured for ${{ matrix.app }}; image published only."
            exit 0
          fi
          curl --fail-with-body --silent --show-error -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"applicationId\":\"$APPLICATION_ID\"}"
